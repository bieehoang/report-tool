<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Report Queue Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0A0E17;
    --surface: #10151F;
    --surface-raised: #161C2A;
    --border: #232B3D;
    --text: #DDE3EE;
    --text-dim: #7A869E;
    --text-dimmer: #4B5568;
    --cyan: #34D3E0;
    --amber: #F0B429;
    --red: #F1636B;
    --green: #3FC98A;
    --violet: #A78BFA;
    --orange: #FB923C;
    --pink: #F472B6;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    padding: 28px 32px 60px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:16px;
  }
  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    color:var(--text-dimmer); text-transform:uppercase;
  }
  .brand h1{
    font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:-0.01em;
    color:var(--text);
  }
  .brand h1 span{ color:var(--cyan); }

  .clock{
    font-family:var(--mono); font-size:12px; color:var(--text-dimmer);
    text-align:right;
  }
  .clock .pulse{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--green); margin-right:6px;
    box-shadow:0 0 0 0 rgba(63,201,138,.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(63,201,138,.5); }
    70%{ box-shadow:0 0 0 6px rgba(63,201,138,0); }
    100%{ box-shadow:0 0 0 0 rgba(63,201,138,0); }
  }

  /* ---------- Stat strip ---------- */
  .stats{
    display:grid; grid-template-columns: repeat(5, 1fr); gap:1px;
    background: var(--border); border:1px solid var(--border); border-radius:10px;
    overflow:hidden; margin-bottom:24px;
  }
  .stat{ background:var(--surface); padding:16px 18px; cursor:pointer; transition:background .15s; }
  .stat:hover{ background:var(--surface-raised); }
  .stat.active{ background:var(--surface-raised); box-shadow: inset 0 2px 0 var(--stat-color, var(--cyan)); }
  .stat .num{ font-family:var(--mono); font-size:26px; font-weight:600; color:var(--text); }
  .stat .label{ font-size:11.5px; color:var(--text-dim); margin-top:2px; letter-spacing:.02em; }

  /* ---------- Controls ---------- */
  .controls{
    display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;
  }
  .search{
    flex:1; min-width:220px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:9px 12px; color:var(--text); font-family:var(--mono); font-size:13px;
  }
  .search::placeholder{ color:var(--text-dimmer); }
  .search:focus{ outline:none; border-color:var(--cyan); }
  select{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    color:var(--text-dim); font-family:var(--sans); font-size:13px; padding:9px 10px;
  }
  .btn{
    font-family:var(--mono); font-size:12.5px; font-weight:500; border-radius:7px;
    padding:9px 14px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-dim); cursor:pointer; transition: all .15s; white-space:nowrap;
  }
  .btn:hover{ color:var(--text); border-color:#354055; }
  .btn.primary{ background:var(--cyan); color:#00232A; border-color:var(--cyan); font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.08); }

  /* ---------- Table ---------- */
  .queue-wrap{
    border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface);
  }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-dimmer); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--border);
    background:var(--surface-raised);
  }
  tbody tr{ border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background: #131A28; }
  tbody tr.selected{ background:#141C2E; box-shadow: inset 3px 0 0 var(--cyan); }
  td{ padding:12px 14px; font-size:13px; vertical-align:middle; }
  td.url{ font-family:var(--mono); color:var(--text); max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.engine{ font-family:var(--mono); font-size:12.5px; color:var(--text-dim); }

  .tag{
    display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:600;
    padding:3px 8px; border-radius:5px; letter-spacing:.02em; text-transform:uppercase;
  }
  .tag.phishing{ background:rgba(167,139,250,.14); color:var(--violet); }
  .tag.scam{ background:rgba(251,146,60,.14); color:var(--orange); }
  .tag.gambling{ background:rgba(244,114,182,.14); color:var(--pink); }

  .status{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--mono);
    font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:99px;
  }
  .status .dot{ width:6px; height:6px; border-radius:50%; }
  .status.pending{ background:rgba(122,134,158,.14); color:var(--text-dim); }
  .status.pending .dot{ background:var(--text-dim); }
  .status.needs_captcha{ background:rgba(240,180,41,.14); color:var(--amber); }
  .status.needs_captcha .dot{ background:var(--amber); }
  .status.in_progress{ background:rgba(52,211,224,.14); color:var(--cyan); }
  .status.in_progress .dot{ background:var(--cyan); }
  .status.submitted{ background:rgba(63,201,138,.14); color:var(--green); }
  .status.submitted .dot{ background:var(--green); }
  .status.failed{ background:rgba(241,99,107,.14); color:var(--red); }
  .status.failed .dot{ background:var(--red); }

  .empty{ padding:60px 20px; text-align:center; color:var(--text-dimmer); font-family:var(--mono); font-size:13px; }

  /* ---------- Drawer ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(4,6,10,.6); backdrop-filter: blur(2px);
    opacity:0; pointer-events:none; transition:opacity .18s; z-index:20;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; height:100vh; width:420px; max-width:92vw;
    background:var(--surface-raised); border-left:1px solid var(--border);
    transform:translateX(100%); transition:transform .22s ease; z-index:21;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:20px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .drawer-head .u{ font-family:var(--mono); font-size:13.5px; color:var(--text); word-break:break-all; line-height:1.5; }
  .drawer-head .close{ background:none; border:none; color:var(--text-dimmer); font-size:18px; cursor:pointer; line-height:1; padding:2px; }
  .drawer-head .close:hover{ color:var(--text); }
  .drawer-body{ padding:20px 22px; overflow-y:auto; flex:1; }
  .field{ margin-bottom:16px; }
  .field .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dimmer); margin-bottom:5px; font-weight:600; }
  .field .v{ font-size:13px; color:var(--text); }
  .field .v.mono{ font-family:var(--mono); font-size:12.5px; }

  .step-note{
    background: rgba(240,180,41,.08); border:1px solid rgba(240,180,41,.25); border-radius:8px;
    padding:12px 14px; font-size:12.5px; color: #E8C979; line-height:1.5; margin-bottom:16px;
  }
  .drawer-actions{ padding:16px 22px; border-top:1px solid var(--border); display:flex; gap:8px; }
  .drawer-actions .btn{ flex:1; text-align:center; }

  .footer-note{ margin-top:20px; font-size:11.5px; color:var(--text-dimmer); font-family:var(--mono); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="eyebrow">Anti-Scam Ops</div>
    <h1>report<span>Q</span>ueue</h1>
  </div>
  <div class="clock"><span class="pulse"></span><span id="clockText">—</span></div>
</div>

<div class="stats" id="statsRow"></div>

<div class="controls">
  <input class="search" id="searchInput" placeholder="tìm theo url / domain..." />
  <select id="categoryFilter">
    <option value="">Tất cả loại</option>
    <option value="phishing">Phishing</option>
    <option value="malware">Malware</option>
  </select>
  <select id="engineFilter">
    <option value="">Tất cả engine</option>
  </select>
  <button class="btn primary" id="addBtn">+ Thêm URL</button>
</div>

<div class="queue-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:26%">URL</th>
        <th style="width:12%">Loại</th>
        <th style="width:16%">Engine</th>
        <th style="width:16%">Trạng thái</th>
        <th style="width:18%">Cập nhật lúc</th>
        <th style="width:12%"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none">Không có report nào khớp bộ lọc.</div>
</div>

<div class="footer-note" id="footerNote"></div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="u" id="drawerUrl"></div>
    <button class="close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-actions" id="drawerActions"></div>
</div>

<script>
const ENGINES = [
  { id:'phishtank', name:'PhishTank', type:'api', captcha:false },
  { id:'urlhaus', name:'URLhaus (abuse.ch)', type:'api', captcha:false },
  { id:'google_sb', name:'Google Safe Browsing', type:'form', captcha:true },
  { id:'eset', name:'ESET Threat Report', type:'form', captcha:true },
  { id:'kaspersky', name:'Kaspersky OpenTIP', type:'form', captcha:true },
  { id:'vncert', name:'VNCERT', type:'email', captcha:false },
];

const CATEGORIES = ['phishing','scam','gambling'];

function randomPast(mins){
  return new Date(Date.now() - mins*60000);
}

function fmtTime(d){
  return d.toLocaleString('vi-VN', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

let REPORTS = [
  mk('hxxp://viet-lotto88[.]xyz/nap-the', 'gambling', 'urlhaus', 'submitted', 340),
  mk('hxxp://vnpay-support-verify[.]com', 'phishing', 'phishtank', 'submitted', 210),
  mk('hxxp://shopee-freeship-uudai[.]top', 'scam', 'google_sb', 'needs_captcha', 40),
  mk('hxxp://mb-bank-secure-login[.]net', 'phishing', 'google_sb', 'needs_captcha', 25),
  mk('hxxp://casino-vip79[.]club', 'gambling', 'eset', 'needs_captcha', 15),
  mk('hxxp://tiktok-shop-giftcode[.]site', 'scam', 'urlhaus', 'in_progress', 6),
  mk('hxxp://fpt-telecom-hoadon[.]info', 'phishing', 'phishtank', 'in_progress', 3),
  mk('hxxp://w88-khuyenmai-vn[.]bet', 'gambling', 'kaspersky', 'pending', 2),
  mk('hxxp://agribank-capnhat-cccd[.]com', 'phishing', 'vncert', 'pending', 1),
  mk('hxxp://binance-airdrop-2026[.]click', 'scam', 'kaspersky', 'failed', 90),
];

let idCounter = REPORTS.length;
function mk(url, category, engineId, status, minsAgo){
  idCounter = (typeof idCounter === 'undefined') ? 0 : idCounter;
  idCounter++;
  return {
    id: idCounter,
    url, category, engineId, status,
    updatedAt: randomPast(minsAgo),
    evidence: 'screenshot_' + idCounter + '.png',
  };
}

let state = { search:'', category:'', engine:'', selectedId:null, activeStat:null };

function engineName(id){ return (ENGINES.find(e=>e.id===id)||{}).name || id; }
function engineOf(id){ return ENGINES.find(e=>e.id===id); }

function statusLabel(s){
  return { pending:'Chờ xử lý', needs_captcha:'Cần giải CAPTCHA', in_progress:'Đang chạy', submitted:'Đã gửi', failed:'Thất bại' }[s] || s;
}

function renderStats(){
  const counts = { total: REPORTS.length };
  ['pending','needs_captcha','in_progress','submitted','failed'].forEach(s=>{
    counts[s] = REPORTS.filter(r=>r.status===s).length;
  });
  const items = [
    { key:null, label:'Tổng số report', num: counts.total, color:'#7A869E' },
    { key:'needs_captcha', label:'Cần bạn giải CAPTCHA', num: counts.needs_captcha, color:'var(--amber)' },
    { key:'in_progress', label:'Đang chạy', num: counts.in_progress, color:'var(--cyan)' },
    { key:'submitted', label:'Đã gửi thành công', num: counts.submitted, color:'var(--green)' },
    { key:'failed', label:'Thất bại / cần thử lại', num: counts.failed, color:'var(--red)' },
  ];
  document.getElementById('statsRow').innerHTML = items.map(it => `
    <div class="stat ${state.activeStat===it.key ? 'active':''}" style="--stat-color:${it.color}" data-stat="${it.key ?? ''}">
      <div class="num">${it.num}</div>
      <div class="label">${it.label}</div>
    </div>
  `).join('');
  document.querySelectorAll('.stat').forEach(el=>{
    el.addEventListener('click', ()=>{
      const val = el.getAttribute('data-stat');
      state.activeStat = val === '' ? null : val;
      renderTable();
      renderStats();
    });
  });
}

function populateEngineFilter(){
  const sel = document.getElementById('engineFilter');
  sel.innerHTML = '<option value="">Tất cả engine</option>' + ENGINES.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
}

function filtered(){
  return REPORTS.filter(r=>{
    if (state.activeStat && r.status !== state.activeStat) return false;
    if (state.category && r.category !== state.category) return false;
    if (state.engine && r.engineId !== state.engine) return false;
    if (state.search && !r.url.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  }).sort((a,b)=> b.updatedAt - a.updatedAt);
}

function renderTable(){
  const rows = filtered();
  const tbody = document.getElementById('tbody');
  document.getElementById('emptyState').style.display = rows.length ? 'none':'block';
  tbody.innerHTML = rows.map(r=>`
    <tr data-id="${r.id}" class="${state.selectedId===r.id?'selected':''}">
      <td class="url">${r.url}</td>
      <td><span class="tag ${r.category}">${r.category}</span></td>
      <td class="engine">${engineName(r.engineId)}</td>
      <td><span class="status ${r.status}"><span class="dot"></span>${statusLabel(r.status)}</span></td>
      <td class="engine">${fmtTime(r.updatedAt)}</td>
      <td style="text-align:right">
        ${r.status==='needs_captcha' ? `<button class="btn" data-action="resume" data-id="${r.id}">Đã giải xong →</button>` : ''}
        ${r.status==='failed' ? `<button class="btn" data-action="retry" data-id="${r.id}">Thử lại</button>` : ''}
      </td>
    </tr>
  `).join('');

  tbody.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('click', (e)=>{
      if (e.target.closest('button')) return;
      openDrawer(Number(tr.getAttribute('data-id')));
    });
  });
  tbody.querySelectorAll('button[data-action="resume"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = Number(btn.getAttribute('data-id'));
      advanceAfterCaptcha(id);
    });
  });
  tbody.querySelectorAll('button[data-action="retry"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = Number(btn.getAttribute('data-id'));
      retry(id);
    });
  });

  document.getElementById('footerNote').textContent =
    `Hiển thị ${rows.length}/${REPORTS.length} report · Engine cần CAPTCHA sẽ tự dừng chờ bạn xác nhận trước khi submit.`;
}

function advanceAfterCaptcha(id){
  const r = REPORTS.find(x=>x.id===id);
  if (!r) return;
  r.status = 'submitted';
  r.updatedAt = new Date();
  renderStats(); renderTable();
  if (state.selectedId === id) openDrawer(id);
}

function retry(id){
  const r = REPORTS.find(x=>x.id===id);
  if (!r) return;
  const eng = engineOf(r.engineId);
  r.status = eng.captcha ? 'needs_captcha' : 'in_progress';
  r.updatedAt = new Date();
  renderStats(); renderTable();
  if (state.selectedId === id) openDrawer(id);
  if (!eng.captcha){
    setTimeout(()=>{
      r.status = 'submitted';
      r.updatedAt = new Date();
      renderStats(); renderTable();
      if (state.selectedId === id) openDrawer(id);
    }, 1400);
  }
}

function openDrawer(id){
  state.selectedId = id;
  const r = REPORTS.find(x=>x.id===id);
  const eng = engineOf(r.engineId);
  document.getElementById('drawerUrl').textContent = r.url;
  document.getElementById('drawerBody').innerHTML = `
    <div class="field"><div class="k">Loại</div><div class="v"><span class="tag ${r.category}">${r.category}</span></div></div>
    <div class="field"><div class="k">Engine đích</div><div class="v">${eng.name} <span style="color:var(--text-dimmer)">(${eng.type === 'api' ? 'gửi qua API' : eng.type === 'email' ? 'gửi qua email' : 'form web'})</span></div></div>
    <div class="field"><div class="k">Trạng thái</div><div class="v"><span class="status ${r.status}"><span class="dot"></span>${statusLabel(r.status)}</span></div></div>
    <div class="field"><div class="k">Bằng chứng đính kèm</div><div class="v mono">${r.evidence}</div></div>
    <div class="field"><div class="k">Cập nhật lúc</div><div class="v mono">${fmtTime(r.updatedAt)}</div></div>
    ${r.status==='needs_captcha' ? `
      <div class="step-note">
        Tool đã tự điền sẵn toàn bộ field (URL, mô tả, ảnh chụp bằng chứng) trên form của <b>${eng.name}</b>.
        Cửa sổ trình duyệt đang mở sẵn — bạn chỉ cần giải CAPTCHA và bấm Submit thật trên trang đó,
        sau đó quay lại đây bấm "Đã giải xong" để tool ghi nhận và chuyển sang report kế tiếp.
      </div>` : ''}
  `;

  const actions = document.getElementById('drawerActions');
  actions.innerHTML = '';
  if (r.status === 'needs_captcha'){
    actions.innerHTML = `<button class="btn primary" id="drawerResume">Đã giải xong, đánh dấu đã gửi</button>`;
    document.getElementById('drawerResume').addEventListener('click', ()=> advanceAfterCaptcha(r.id));
  } else if (r.status === 'failed'){
    actions.innerHTML = `<button class="btn primary" id="drawerRetry">Thử lại report này</button>`;
    document.getElementById('drawerRetry').addEventListener('click', ()=> retry(r.id));
  } else {
    actions.innerHTML = `<button class="btn" id="drawerCloseBtn">Đóng</button>`;
    document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  }

  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  renderTable();
}

function closeDrawer(){
  state.selectedId = null;
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  renderTable();
}

document.getElementById('overlay').addEventListener('click', closeDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);

document.getElementById('searchInput').addEventListener('input', (e)=>{ state.search = e.target.value; renderTable(); });
document.getElementById('categoryFilter').addEventListener('change', (e)=>{ state.category = e.target.value; renderTable(); });
document.getElementById('engineFilter').addEventListener('change', (e)=>{ state.engine = e.target.value; renderTable(); });

document.getElementById('addBtn').addEventListener('click', ()=>{
  const url = prompt('Nhập URL cần report (vd: hxxp://example[.]com):');
  if (!url) return;
  const category = prompt('Loại (phishing / scam / gambling):', 'phishing');
  const engineId = ENGINES[Math.floor(Math.random()*ENGINES.length)].id;
  const eng = engineOf(engineId);
  const r = mk(url, CATEGORIES.includes(category) ? category : 'phishing', engineId, eng.captcha ? 'needs_captcha' : 'pending', 0);
  REPORTS.unshift(r);
  renderStats(); renderTable();
});

function tickClock(){
  document.getElementById('clockText').textContent = new Date().toLocaleString('vi-VN', { hour:'2-digit', minute:'2-digit', second:'2-digit', day:'2-digit', month:'2-digit', year:'numeric' });
}
setInterval(tickClock, 1000);
tickClock();

populateEngineFilter();
renderStats();
renderTable();
</script>
</body>
</html>
